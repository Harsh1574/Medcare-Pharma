<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F44"/>
      <stop offset="0.55" stop-color="#123A7A"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FD3DA"/>
    </marker>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#FFFFFF" fill-opacity="0.05">
    <circle cx="1100" cy="60" r="90"/>
    <circle cx="1210" cy="250" r="140"/>
  </g>

  <!-- capsule logo -->
  <g transform="translate(64,58) rotate(-35 28 28)">
    <rect x="0" y="14" width="56" height="28" rx="14" fill="#FFFFFF"/>
    <rect x="28" y="14" width="28" height="28" rx="0" fill="#7FD3DA"/>
    <rect x="28" y="14" width="28" height="28" rx="14" fill="#7FD3DA"/>
    <rect x="28" y="14" width="10" height="28" fill="#7FD3DA"/>
  </g>

  <text x="140" y="96" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">MedCare Pharma</text>
  <text x="140" y="132" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#CFE3FF">AI-assisted Demand Sensing &amp; Autonomous Procure-to-Pay</text>
  <text x="64" y="186" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#9FC2E8">From spotting a medicine shortage to paying the supplier, in one connected pipeline.</text>

  <!-- pipeline chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <g transform="translate(64,230)">
      <rect width="132" height="52" rx="12" fill="url(#chip)" stroke="#7FD3DA" stroke-opacity="0.5"/>
      <text x="66" y="23">Sense</text><text x="66" y="42" font-size="11" font-weight="400" fill="#CFE3FF">forecast demand</text>
    </g>
    <g transform="translate(224,230)">
      <rect width="132" height="52" rx="12" fill="url(#chip)" stroke="#7FD3DA" stroke-opacity="0.5"/>
      <text x="66" y="23">Request</text><text x="66" y="42" font-size="11" font-weight="400" fill="#CFE3FF">chat → requisition</text>
    </g>
    <g transform="translate(384,230)">
      <rect width="132" height="52" rx="12" fill="url(#chip)" stroke="#7FD3DA" stroke-opacity="0.5"/>
      <text x="66" y="23">Source</text><text x="66" y="42" font-size="11" font-weight="400" fill="#CFE3FF">AI supplier pick</text>
    </g>
    <g transform="translate(544,230)">
      <rect width="132" height="52" rx="12" fill="url(#chip)" stroke="#7FD3DA" stroke-opacity="0.5"/>
      <text x="66" y="23">Order</text><text x="66" y="42" font-size="11" font-weight="400" fill="#CFE3FF">purchase order</text>
    </g>
    <g transform="translate(704,230)">
      <rect width="132" height="52" rx="12" fill="url(#chip)" stroke="#7FD3DA" stroke-opacity="0.5"/>
      <text x="66" y="23">Receive</text><text x="66" y="42" font-size="11" font-weight="400" fill="#CFE3FF">goods receipt</text>
    </g>
    <g transform="translate(864,230)">
      <rect width="132" height="52" rx="12" fill="url(#chip)" stroke="#7FD3DA" stroke-opacity="0.5"/>
      <text x="66" y="23">Invoice</text><text x="66" y="42" font-size="11" font-weight="400" fill="#CFE3FF">OCR extraction</text>
    </g>
    <g transform="translate(1024,230)">
      <rect width="180" height="52" rx="12" fill="#7FD3DA" fill-opacity="0.22" stroke="#7FD3DA"/>
      <text x="90" y="23">3-Way Match</text><text x="90" y="42" font-size="11" font-weight="400" fill="#CFE3FF">auto-approve or flag</text>
    </g>
  </g>
  <g stroke="#7FD3DA" stroke-width="2" marker-end="url(#arrow)">
    <line x1="198" y1="256" x2="220" y2="256"/>
    <line x1="358" y1="256" x2="380" y2="256"/>
    <line x1="518" y1="256" x2="540" y2="256"/>
    <line x1="678" y1="256" x2="700" y2="256"/>
    <line x1="838" y1="256" x2="860" y2="256"/>
    <line x1="998" y1="256" x2="1020" y2="256"/>
  </g>

  <text x="64" y="318" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#9FC2E8">Built for the Cognizant NPN Supply Chain Hackathon · Next.js · FastAPI · Flask · XGBoost · OCR</text>
</svg>
